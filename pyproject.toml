[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-control-analyzer"
version = "1.0.0"
description = "A defensive, passive HTTP caching security analysis tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mr Dinesh Pathro" }
]
keywords = ["security", "http", "cache-control", "web-security", "headers", "cdn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
gui = ["flask>=3.0,<4.0"]

[project.urls]
Homepage = "https://buymeacoffee.com/mrdineshpathro"
YouTube = "https://youtube.com/@githubhacker?si=RhxMBWbdJx_VYDM3"

[project.scripts]
cache-analyzer = "cache_analyzer.cli:app"

[tool.setuptools]
packages = ["cache_analyzer", "cache_analyzer.rules", "cache_analyzer.utils"]
